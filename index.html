<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0B6B4F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="帮帮鸭">
<meta name="mobile-web-app-capable" content="yes">
<title>帮帮鸭智慧悬赏</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
/* ============================================================
   帮帮鸭智慧悬赏 · App 设计令牌
   ============================================================ */
:root{
  --green-900:#0A5C43; --green-800:#0B6B4F; --green-700:#0E7C5A;
  --green-600:#128A64; --green-500:#17916B; --green-400:#2FA45C;
  --green-100:#D8EDE4; --green-050:#EAF6F1;
  --lime-400:#A8CB3B;
  --amber-600:#E08900; --amber-500:#F5A623; --amber-400:#FFB63C;
  --amber-100:#FFF3D9; --amber-line:#F2D08A;
  --ink:#1E2A26; --ink-2:#5F6F69; --ink-3:#97A5A0;
  --line:#ECEFEE; --bg:#F4F6F5; --card:#FFFFFF;
  --danger:#E5484D;
  --brand-grad:linear-gradient(135deg,#0B6B4F 0%,#0F7F5E 52%,#17916B 100%);
  --bar-grad:linear-gradient(180deg,#128A64 0%,#3EA55F 48%,#F5A623 100%);
  --fab-grad:linear-gradient(155deg,#0E8A70 0%,#2FA45C 52%,#A8CB3B 100%);
  --r-sm:8px; --r-md:12px; --r-lg:16px; --r-xl:20px; --r-pill:999px;
  --sh-card:0 1px 2px rgba(16,40,32,.05), 0 6px 20px rgba(16,40,32,.06);
  --sh-glass:0 8px 32px rgba(10,60,45,.12);
  --sh-fab:0 6px 20px rgba(26,150,90,.42);
  --safe-t:env(safe-area-inset-top,0px);
  --safe-b:env(safe-area-inset-bottom,0px);
  --bar-h:96px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overscroll-behavior:none}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  background:#0E1512; color:var(--ink); overflow:hidden;
  display:flex; align-items:center; justify-content:center;
}
button,input,textarea{font:inherit;color:inherit;border:none;background:none;outline:none}
button{cursor:pointer;text-align:left}
ul{list-style:none}
svg{display:block;flex:none}

/* ---------- 设备外壳（桌面预览时显示手机边框；真机全屏） ---------- */
#app{
  position:relative; width:390px; height:844px; background:var(--bg);
  border-radius:38px; overflow:hidden; display:flex; flex-direction:column;
  box-shadow:0 40px 100px rgba(0,0,0,.6), 0 0 0 10px #101714, 0 0 0 11px #2B3A34;
}
/* 真机（窄屏）全屏铺满；桌面预览时显示手机边框 */
@media (max-width:600px){
  body{background:var(--bg)}
  #app{width:100vw; height:100dvh; border-radius:0; box-shadow:none}
  :root{--bar-h:88px}
}

/* ---------- 应用头栏（毛玻璃） ---------- */
.appbar{
  position:absolute; top:0; left:0; right:0; z-index:40; padding-top:var(--safe-t);
  height:calc(var(--bar-h) + var(--safe-t));
  display:flex; align-items:flex-end; padding-bottom:10px;
  transition:background .28s, backdrop-filter .28s, border-color .28s;
  border-bottom:1px solid transparent;
}
.appbar .ttl{position:absolute; left:0; right:0; bottom:12px; text-align:center;
  font-size:16px; font-weight:600; color:#fff; transition:color .28s; pointer-events:none}
.appbar.solid{background:rgba(255,255,255,.78); -webkit-backdrop-filter:blur(22px) saturate(180%);
  backdrop-filter:blur(22px) saturate(180%); border-bottom-color:rgba(20,60,45,.07)}
.appbar.solid .ttl{color:var(--ink)}
.appbar .back{position:relative; margin-left:8px; width:36px; height:36px; display:flex; align-items:center;
  justify-content:center; color:#fff; z-index:2; transition:color .28s}
.appbar.solid .back{color:var(--ink)}
.appbar.on-hero{background:transparent}
.appbar.on-hero .ttl{color:#fff}
.appbar .dots{position:absolute; right:14px; bottom:20px; display:flex; gap:4px; opacity:.7}
.appbar .dots i{width:4px;height:4px;border-radius:50%;background:currentColor;color:#fff}
.appbar.solid .dots i{color:var(--ink-3)}

/* ---------- 滚动区 ---------- */
.view{flex:1; overflow-y:auto; overflow-x:hidden; -webkit-overflow-scrolling:touch; position:relative}
.view::-webkit-scrollbar{width:0}
.view.has-bar{padding-bottom:calc(var(--bar-h) + var(--safe-b) + 34px)}
.view.has-actions{padding-bottom:calc(84px + var(--safe-b))}

/* ---------- 通用 ---------- */
.card{background:var(--card); border-radius:var(--r-lg); box-shadow:var(--sh-card)}
.sub{color:var(--ink-2); font-size:12px; line-height:1.6}
.sec-head{display:flex; align-items:center; gap:8px; padding:17px 14px 11px}
.sec-head .bar{width:4px;height:17px;border-radius:2px;background:var(--amber-500)}
.sec-head h3{font-size:16.5px;font-weight:700}
.pill-count{font-size:11px;color:var(--green-700);background:var(--green-050);border-radius:var(--r-pill);padding:3px 9px}
.btn{display:inline-flex;align-items:center;justify-content:center;font-weight:600;border-radius:var(--r-pill);
  transition:transform .14s, box-shadow .18s}
.btn:active{transform:scale(.972)}
.btn-pri{background:var(--green-600);color:#fff;box-shadow:0 2px 10px rgba(18,138,100,.22)}
.btn-pri:disabled{background:#DCE3E0;color:#9FAEA9;box-shadow:none;cursor:default}
.btn-amber{background:linear-gradient(135deg,#FFB63C,#F5A623);color:#fff;box-shadow:0 2px 10px rgba(245,166,35,.28)}
.btn-ghost{background:#fff;color:var(--green-700);border:1px solid var(--green-100)}
.btn-white{background:#fff;color:var(--ink-2);border:1px solid var(--line)}
/* 胶囊标签（原版为浅色底 + 彩色字，全圆角） */
.tag{display:inline-flex;align-items:center;font-size:11px;line-height:1;padding:5px 10px;border-radius:var(--r-pill);
  background:#F1F4F3;color:var(--ink-2);white-space:nowrap}
.tag.c-green {background:#E7F5EE;color:#0E8A5F}
.tag.c-amber {background:#FFF2DC;color:#C0770A}
.tag.c-blue  {background:#E9F1FE;color:#2F6BD8}
.tag.c-purple{background:#EFEBFF;color:#6D5BD0}
.tag.c-gray  {background:#F0F2F5;color:#6B7A87}

/* ---------- 毛玻璃 ---------- */
.glass{
  background:rgba(255,255,255,.72);
  -webkit-backdrop-filter:blur(20px) saturate(180%);
  backdrop-filter:blur(20px) saturate(180%);
  border:1px solid rgba(255,255,255,.65);
  box-shadow:var(--sh-glass);
}
.glass-soft{
  background:rgba(255,255,255,.20);
  -webkit-backdrop-filter:blur(14px) saturate(160%);
  backdrop-filter:blur(14px) saturate(160%);
  border:1px solid rgba(255,255,255,.30);
}

/* ---------- 头图 ---------- */
.hero{position:relative; overflow:hidden; color:#fff; background:var(--brand-grad)}
.hero .deco{position:absolute; inset:0; pointer-events:none}
.hero .deco .glow{position:absolute; right:-90px; bottom:-120px; width:330px; height:330px; border-radius:50%;
  background:radial-gradient(circle, rgba(216,255,140,.34) 0%, rgba(216,255,140,.07) 46%, transparent 70%)}
.hero .deco .ring{position:absolute; border-radius:50%; border:1px solid rgba(255,255,255,.09)}
.hero .deco .ring.r1{right:2px; top:12px; width:132px; height:132px; border-color:rgba(255,255,255,.11)}
.hero .deco .ring.r2{right:22px; top:32px; width:92px; height:92px; border-color:rgba(255,255,255,.08)}
.hero .deco .ring.r3{right:-46px; top:-36px; width:210px; height:210px; border-color:rgba(255,255,255,.055)}
.hero .deco .dot{position:absolute; width:3px; height:3px; border-radius:50%; background:rgba(255,255,255,.34)}
.hero .body{position:relative; z-index:2}
.loc{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:#EAF6F1;
  background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.24);border-radius:var(--r-pill);padding:4px 11px}
.hero h1{font-size:25px;font-weight:800;letter-spacing:.3px;margin:12px 0 6px}
.hero .hs{font-size:12px;color:#CDE9DE}

/* 毛玻璃积分球 */
.orb{
  position:absolute; right:16px; top:8px; width:78px; height:78px; border-radius:50%;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  background:radial-gradient(circle at 34% 28%, rgba(255,255,255,.36), rgba(255,255,255,.07) 58%, rgba(255,255,255,.02) 74%);
  -webkit-backdrop-filter:blur(8px) saturate(170%);
  backdrop-filter:blur(8px) saturate(170%);
  border:1px solid rgba(255,255,255,.42);
  box-shadow:inset 0 1px 10px rgba(255,255,255,.28), 0 6px 22px rgba(6,50,36,.18);
  z-index:3;
}
.orb::before{content:""; position:absolute; width:50px; height:50px; border-radius:50%;
  border:1px solid rgba(255,255,255,.28)}
.orb::after{content:""; position:absolute; width:22px; height:22px; border-radius:50%;
  border:1px solid rgba(255,255,255,.22)}
.orb b{font-size:21px;font-weight:800;line-height:1;position:relative;z-index:1}
.orb span{font-size:10px;color:#D6EFE6;position:relative;z-index:1}

/* 毛玻璃搜索条 */
.searchbar{display:flex;gap:8px;margin-top:16px;position:relative;z-index:3}
.searchbar .f{flex:1;display:flex;align-items:center;gap:7px;border-radius:var(--r-pill);
  padding:10px 14px;color:rgba(255,255,255,.86);font-size:12.5px;overflow:hidden;
  background:rgba(255,255,255,.19);
  -webkit-backdrop-filter:blur(14px) saturate(160%);
  backdrop-filter:blur(14px) saturate(160%);
  border:1px solid rgba(255,255,255,.30)}
.searchbar .f input{flex:1;min-width:0;font-size:12.5px;color:#fff}
.searchbar .f input::placeholder{color:rgba(255,255,255,.72)}
.searchbar .go{background:linear-gradient(135deg,#FFB63C,#F5A623);color:#fff;font-size:13px;font-weight:600;
  border-radius:var(--r-pill);padding:0 18px;flex:none;box-shadow:0 3px 12px rgba(245,166,35,.34)}
.searchbar .go.dark{background:#0B6B4F;box-shadow:0 3px 12px rgba(11,107,79,.30)}

/* ---------- 首页 ---------- */
.home-hero{padding:calc(var(--bar-h) + var(--safe-t) + 4px) 14px 44px}
/* 便民服务：毛玻璃卡片上移压住头图 */
.svc{margin:-34px 12px 0; position:relative; z-index:5; padding:14px 14px 6px; border-radius:var(--r-xl)}
.svc-top{display:flex;align-items:baseline;gap:8px;margin-bottom:14px}
.svc-top h3{font-size:16px;font-weight:700}
.svc-top .lnk{margin-left:auto;font-size:11.5px;color:var(--green-700);display:inline-flex;align-items:center;gap:2px;
  background:var(--green-050);border-radius:var(--r-pill);padding:5px 10px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.svc-item{display:flex;flex-direction:column;align-items:center;gap:7px;padding-bottom:12px;position:relative}
.ico{width:46px;height:46px;border-radius:14px;display:flex;align-items:center;justify-content:center;position:relative}
.ico-a{background:#EDF4FF} .ico-b{background:#F1EDFF} .ico-c{background:#EAF7F0} .ico-d{background:#EDF1FD}
.svc-item .nm{font-size:12.5px;font-weight:600}
.svc-item .ds{font-size:10.5px;color:var(--ink-3);margin-top:-3px}
.corner{position:absolute;top:-5px;right:10px;font-size:9px;background:var(--amber-500);color:#fff;
  border-radius:5px;padding:1.5px 4px;box-shadow:0 2px 6px rgba(245,166,35,.4);z-index:2}

.modes{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 12px 0}
.mode{display:flex;align-items:center;gap:10px;padding:13px 12px;position:relative;overflow:hidden}
.mode .ic{width:34px;height:34px;border-radius:11px;display:flex;align-items:center;justify-content:center;background:#F2F7F5}
.mode.off .ic{background:#FFF6E6}
.mode b{font-size:13.5px;font-weight:700;display:block}
.mode span{font-size:10.5px;color:var(--ink-3)}
.mode .radio{position:absolute;right:11px;top:12px;width:9px;height:9px;border-radius:50%;background:#DCE3E0}
.mode.on .radio{background:var(--green-600);box-shadow:0 0 0 3px rgba(18,138,100,.14)}

.list-head{display:flex;align-items:center;gap:8px;padding:18px 12px 9px}
.list-head .bar{width:4px;height:17px;border-radius:2px;background:var(--amber-500)}
.list-head h3{font-size:16.5px;font-weight:700}
.catbtn{margin-left:auto;font-size:12px;color:var(--green-700);border:1px solid var(--green-100);
  border-radius:var(--r-pill);padding:7px 15px;background:#fff}
.feed{display:flex;flex-direction:column;gap:10px;padding:0 12px}

/* 任务卡：通高 绿→琥珀 渐变竖条 + 贴边 */
.task{position:relative;overflow:hidden;padding:15px 14px 0 19px;border-radius:var(--r-md)}
.task::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--bar-grad);
  border-radius:var(--r-md) 0 0 var(--r-md)}
.task-top{display:flex;gap:10px;align-items:flex-start}
.task-ic{width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;flex:none}
.task-top h4{font-size:15px;font-weight:700;line-height:1.35;flex:1;padding-right:8px}
.points{flex:none;min-width:56px;text-align:center;border-radius:11px;padding:7px 8px 5px;
  background:linear-gradient(135deg,#FFF3DC,#FFE6BE);box-shadow:inset 0 1px 0 rgba(255,255,255,.7)}
.points b{display:block;font-size:19px;font-weight:800;line-height:1;color:#D2790A}
.points span{font-size:10px;color:#C98A2A}
.task-tags{display:flex;flex-wrap:wrap;gap:5px;margin:10px 0 8px}
.task-desc{font-size:12.5px;color:var(--ink-2);line-height:1.6;display:-webkit-box;-webkit-line-clamp:1;
  -webkit-box-orient:vertical;overflow:hidden}
.task-author{display:flex;align-items:center;gap:7px;margin:10px 0}
.avatar{width:23px;height:23px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px}
.task-author span{font-size:12px;color:var(--ink-2)}
.task-foot{display:flex;align-items:center;gap:10px;font-size:11px;color:var(--ink-3);
  border-top:1px solid var(--line);margin:0 -14px 0 -19px;padding:10px 14px 11px 19px}
.task-foot .gt{display:flex;align-items:center;gap:3px}
.task-foot .ap{color:var(--amber-600);font-weight:600}
.status{margin-left:auto;font-size:11px;color:#0E9F6E;background:#E7F7F0;border-radius:var(--r-pill);padding:4px 10px;font-weight:600}

/* ---------- 底部 Tab Bar ---------- */
.tabbar{position:absolute;left:0;right:0;bottom:0;z-index:40;
  height:calc(var(--bar-h) + var(--safe-b)); padding-bottom:var(--safe-b);
  background:rgba(255,255,255,.86);
  -webkit-backdrop-filter:blur(22px) saturate(180%);
  backdrop-filter:blur(22px) saturate(180%);
  border-top:1px solid rgba(20,60,45,.07);
  display:flex; align-items:center}
.tabbar .tb{flex:1;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  color:#9AA8A3;font-size:10.5px;position:relative}
.tabbar .tb svg{opacity:.8}
.tabbar .tb.on{color:var(--green-700);font-weight:600}
.tabbar .tb.on svg{opacity:1}
.tabbar .mid{flex:1;height:100%;position:relative}
.tabbar .fab{position:absolute;left:50%;top:-26px;transform:translateX(-50%);
  width:54px;height:54px;border-radius:50%;background:var(--fab-grad);
  box-shadow:var(--sh-fab), inset 0 1px 0 rgba(255,255,255,.28);
  display:flex;align-items:center;justify-content:center;color:#fff;z-index:2}
.tabbar .fab:active{transform:translateX(-50%) scale(.95)}
.tabbar .lbl{position:absolute;left:0;right:0;bottom:8px;text-align:center;font-size:10.5px;color:#9AA8A3;pointer-events:none}

/* ---------- 商家联盟 ---------- */
.mch-hero{padding:calc(var(--bar-h) + var(--safe-t) + 2px) 14px 18px}
.mch-hero .ill{position:absolute;right:14px;top:calc(var(--bar-h) + var(--safe-t) + 6px);width:104px;height:74px;z-index:2}
.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 12px 4px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;font-size:12.5px;color:var(--ink-2);background:#fff;border:1px solid var(--line);
  border-radius:var(--r-pill);padding:7px 15px}
.chip.on{background:var(--green-600);border-color:var(--green-600);color:#fff;font-weight:600;box-shadow:0 2px 10px rgba(18,138,100,.22)}
.mch-bar{display:flex;align-items:center;padding:11px 14px 6px;font-size:12px;color:var(--ink-2)}
.mch-bar .sort{margin-left:auto;display:flex;align-items:center;gap:3px;font-weight:600}
.mch{padding:15px 14px;margin:0 12px 10px;position:relative;overflow:hidden}
.mch-top{display:flex;gap:11px;align-items:flex-start}
.logo{width:52px;height:52px;border-radius:13px;flex:none;display:flex;align-items:center;justify-content:center;
  color:#fff;font-size:21px;font-weight:700;box-shadow:0 4px 14px rgba(20,50,40,.16)}
.mch-top h4{font-size:14.5px;font-weight:700;line-height:1.42;flex:1;padding-right:6px}
.badge-line{display:inline-flex;align-items:center;font-size:10.5px;color:#0E9F6E;background:#EAF9F1;
  border-radius:var(--r-pill);padding:3px 9px}
.mch-badges{display:flex;flex-wrap:wrap;gap:6px;margin:11px 0 10px}
.mb{font-size:11px;border-radius:var(--r-pill);padding:4px 9px;display:flex;align-items:center;gap:5px}
.mb.g{background:#EAF7F1;color:#0E8A5F}
.mb.a{background:#FFF4E4;color:#C77A08}
.mb i{width:4px;height:4px;border-radius:50%;background:currentColor;display:block}
.kv{display:grid;grid-template-columns:1fr 1fr;font-size:12.5px;line-height:2.1}
.kv .k{color:var(--ink-3);width:78px;display:inline-block}
.more{font-size:12.5px;color:var(--amber-600);margin-top:6px;display:flex;align-items:center;gap:3px}
.mch-foot{display:flex;align-items:center;gap:8px;border-top:1px solid var(--line);margin-top:12px;padding-top:12px}

/* ---------- 空态 ---------- */
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:70px 30px;gap:13px;text-align:center}
.empty .bx{width:64px;height:64px;border-radius:19px;background:#EFF3F1;border:1px dashed #CBD6D1;
  display:flex;align-items:center;justify-content:center;color:#B6C3BE}
.empty h4{font-size:15px;font-weight:700}
.empty p{font-size:12.5px;color:var(--ink-3)}
.empty .acts{display:flex;gap:10px;margin-top:5px}
.empty .acts .btn{padding:10px 24px;font-size:13px}

/* ---------- 我的 ---------- */
.me-hero{padding:calc(var(--bar-h) + var(--safe-t) + 6px) 16px 24px}
.me-hero .row{display:flex;align-items:center;gap:13px}
.me-av{width:62px;height:62px;border-radius:50%;background:linear-gradient(135deg,#FFE9A8,#FFD166);
  display:flex;align-items:center;justify-content:center;position:relative;border:2px solid rgba(255,255,255,.65);
  box-shadow:0 6px 20px rgba(6,50,36,.22)}
.me-av .ok{position:absolute;right:-2px;bottom:-2px;width:19px;height:19px;border-radius:50%;background:#2F80ED;
  border:2px solid #0F7F5E;display:flex;align-items:center;justify-content:center;color:#fff}
.me-name{font-size:19px;font-weight:800;display:flex;align-items:center;gap:7px}
.me-plain{font-size:12.5px;color:#CDE9DE;margin-top:5px}
.me-sex{display:inline-flex;align-items:center;gap:5px;margin-top:9px;font-size:11.5px;color:#DCEFE7;
  background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.2);border-radius:var(--r-pill);padding:4px 11px}
.me-bind{padding:16px;text-align:center;margin:12px}
.me-bind .btn{width:100%;padding:13px;font-size:14.5px}
.me-stats{display:grid;grid-template-columns:repeat(4,1fr);margin:0 12px}
.me-stats .st{text-align:center;padding:15px 0;position:relative}
.me-stats .st+.st::before{content:"";position:absolute;left:0;top:19px;bottom:19px;width:1px;background:var(--line)}
.me-stats b{display:block;font-size:19px;font-weight:800}
.me-stats span{font-size:12px;color:var(--ink-3)}
.vip-band{margin:12px;border-radius:var(--r-lg);padding:15px 16px;display:flex;align-items:center;gap:12px;

  padding:12px;font-size:12.5px;line-height:1.7;resize:none}
.sheet textarea::placeholder{color:#AEBAB6}
.sheet .ta-foot{text-align:right;font-size:11px;color:var(--ink-3);margin:6px 0 12px}
.toast{position:absolute;left:50%;bottom:130px;transform:translate(-50%,14px);background:rgba(20,32,27,.92);color:#fff;

document.getElementById('app').addEventListener('click',e=>{
  const el=e.target.closest('[data-nav],[data-act],[data-task],[data-mch-status],[data-pub-mode],[data-sw],[data-tag],[data-pts],[data-pay],[data-mt1],[data-mt2],[data-fcat],[data-fbounty],[data-fsort],[data-fscope],[data-ltype]');
  if(!el)return; const d=el.dataset;
  if(d.nav){go(d.nav);return;}
  if(d.task){go('task',{task:TASKS.find(t=>t.id===d.task)});return;}
  if(d.mchStatus){S.mchStatus=d.mchStatus;render();return;}
  if(d.pubMode){S.pubMode=d.pubMode;render();return;}
  if(d.mt1){S.mt1=d.mt1;render();return;}
  if(d.mt2){S.mt2=d.mt2;render();return;}
  if(d.fcat!==undefined){S.cat=d.fcat;sheetFilter();return;}
  if(d.fbounty!==undefined){S.bounty=d.fbounty;sheetFilter();return;}
  if(d.fsort!==undefined){S.sort=d.fsort;sheetFilter();return;}
  if(d.fscope!==undefined){S.scope=d.fscope;sheetFilter();return;}
  if(d.ltype){S.lead.type=d.ltype;sheetLead();return;}
  if(d.tag){const i=S.pub.tags.indexOf(d.tag);i<0?S.pub.tags.push(d.tag):S.pub.tags.splice(i,1);render();return;}
  if(d.pts){S.pub.points=+d.pts;render();return;}
  if(d.pay){S.pub.pay=d.pay;render();return;}
  if(d.sw!==undefined){S.pub[d.sw]=!S.pub[d.sw];render();return;}
  switch(d.act){
    case 'search':toast('搜索：'+(S.q||'全部任务'));break;
    case 'filter':sheetFilter();break;
    case 'filter-all':S.cat='全部';S.bounty='赏金不限';S.sort='最新发布';toast('已展示最新招募中的悬赏');break;
    case 'filter-reset':S.cat='全部';S.bounty='赏金不限';S.sort='最新发布';S.scope='我的发布';sheetFilter();break;
    case 'filter-apply':closeSheet();toast('筛选已应用');break;
    case 'sheet-close':closeSheet();break;
    case 'lead':S.lead.merchant=MERCHANTS.find(m=>m.id===d.m);S.lead.brief='';S.lead.type='对接线索';sheetLead();break;
    case 'lead-start':S.lead.merchant=MERCHANTS[0];sheetLead();break;
    case 'lead-next':{const b=document.getElementById('lead-brief');if(b)S.lead.brief=b.value;
      if(S.lead.brief.length<10){toast('需求说明至少 10 个字');return;}
      toast('已提交，等待平台审核');closeSheet();break;}
    case 'mch-detail':toast('商家详情页（复刻范围外）');break;
    case 'mch-sort':S.mchSort=S.mchSort==='默认推荐'?'距离最近':'默认推荐';render();break;
    case 'bind':toast('调起手机号授权');break;
    case 'soon':toast('该页面未在本站复刻范围内');break;
    case 'pub-next':S.pubStep=2;render();break;
    case 'pub-prev':S.pubStep=1;render();break;
    case 'pub-submit':toast('发布成功，等待平台审核');S.pubStep=1;S.pub.title='';S.pub.tags=[];S.pub.points=0;go('home');break;
    case 'credit':toast('信用分与预授权说明');break;
    case 'fav':toast('已收藏');break;
    case 'share':toast('已复制任务链接');break;
    case 'apply':toast('申请已提交，等待发布者派单');break;
    case 'contact':toast('打开会话');break;
    case 'upgrade':toast('调起支付 ¥99');break;
    case 'add-tag':{const i=document.getElementById('pub-tag');if(i&&i.value.trim()){S.pub.tags.push(i.value.trim());render();}break;}
  }
});
document.getElementById('mask').addEventListener('click',closeSheet);
document.getElementById('btn-back').addEventListener('click',()=>{
  if(S.route==='publish'&&S.pubStep===2){S.pubStep=1;render();return;}
  go('home');
});
document.getElementById('view').addEventListener('input',e=>{
  if(e.target.id==='home-q')S.q=e.target.value;
  if(e.target.id==='pub-title'){S.pub.title=e.target.value;
    const c=e.target.parentElement.querySelector('.counter');if(c)c.textContent=e.target.value.length+'/30';
    const b=document.querySelector('[data-act="pub-next"]');if(b)b.disabled=!e.target.value.trim();}
  if(e.target.id==='pub-pts'){S.pub.points=+e.target.value.replace(/\D/g,'')||0;
    const b=document.querySelector('[data-act="pub-submit"]');if(b)b.disabled=S.pub.points<=0;}
});
document.getElementById('sheet').addEventListener('input',e=>{
  if(e.target.id==='lead-brief'){S.lead.brief=e.target.value;
    const f=e.target.parentElement.querySelector('.ta-foot');if(f)f.textContent=e.target.value.length+'/300';}
});
/* 滚动时头栏由透明转毛玻璃 */
document.getElementById('view').addEventListener('scroll',e=>{
  const y=e.target.scrollTop;
  const ab=document.getElementById('appbar');
  if(HERO_ROUTES.includes(S.route)){
    const onHero = y < 60;
    ab.classList.toggle('on-hero',onHero);
    ab.classList.toggle('solid',!onHero);
  }
},{passive:true});

const START=(location.hash.slice(1)||'home');
go(VIEWS[START]?START:'home');
window.addEventListener('hashchange',()=>{const r=location.hash.slice(1);if(VIEWS[r]&&r!==S.route)go(r);});
if('serviceWorker' in navigator && location.protocol.startsWith('http')){
  window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
}
</script>
</body>
</html>
